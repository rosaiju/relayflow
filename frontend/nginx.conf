server {
    listen 80;
    root /usr/share/nginx/html;

    # Re-resolve the API through Docker's DNS: recreating the api container changes its IP,
    # and a static proxy_pass hostname would keep pointing at the old address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Fail fast when the API is down: connecting to a stopped container's old address
        # can otherwise hang for nginx's 60 s default (observed on Linux Docker).
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;   # client-side routing
    }
}
