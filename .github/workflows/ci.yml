name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests with PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Test-only credentials for an ephemeral CI database.
          POSTGRES_USER: relayflow
          POSTGRES_PASSWORD: relayflow
          POSTGRES_DB: relayflow_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U relayflow" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      RELAYFLOW_TEST_DATABASE_URL: postgresql+psycopg://relayflow:relayflow@127.0.0.1:5433/relayflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -m "not integration" -q
      - name: Integration and correctness tests (real PostgreSQL, subprocess crashes)
        run: uv run pytest -m integration -q

  frontend:
    name: Frontend (types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Stack (browser e2e + crash-recovery demo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    env:
      RELAYFLOW_ENABLE_FAULT_INJECTION: "1"  # local CI stack only; synthetic data
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - name: Start stack
        run: docker compose up -d --build --wait postgres mocknotify api scheduler worker-a worker-b dashboard
      - name: Install Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: Automated crash-recovery demo
        run: uv run python scripts/demo_recovery.py
      - name: Stack tests (PostgreSQL outage longer than the lease; API-only restart)
        env:
          RELAYFLOW_STACK_TESTS: "1"
        run: uv run pytest tests/stack -v -p no:cacheprovider
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-and-demo-output
          path: |
            frontend/playwright-report
            demo-output
          if-no-files-found: ignore
